# ===============================================
# CONFIGURAÇÃO DA APLICAÇÃO
# ===============================================
spring.application.name=BackEnd
server.port=8080

# ===============================================
# CONFIGURAÇÃO DO BANCO DE DADOS (Seus Dados)
# ===============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/detalheprata_db
spring.datasource.username=postgres
spring.datasource.password=12345
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================================
# CONFIGURAÇÃO DO TOKEN JWT (Sua Chave)
# ===============================================
api.security.token.secret=meu-secret-super-secreto-e-longo-para-garantir-seguranca
api.security.token.expiration=86400000

# ===============================================
# CONFIGURAÇÃO DE E-MAIL (Credenciais Corretas)
# ===============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# E-mail da loja criado por você
spring.mail.username=contatodetalheprata@gmail.com

# Senha de aplicativo gerada (sem espaços)
spring.mail.password=dyfotifipuscuswo

# Configurações adicionais para o Gmail
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================================
# CONFIGURAÇÃO DO SPRING SECURITY
# ===============================================
spring.security.oauth2.client.registration.google.client-id=your-google-client-id
spring.security.oauth2.client.registration.google.client-secret=your-google-client-secret

# ===============================================
# CONFIGURAÇÃO DE LOGGING
# ===============================================
logging.level.com.detalhePrata=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================================
# CONFIGURAÇÃO DE CORS
# ===============================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# ===============================================
# CONFIGURAÇÕES ADICIONAIS
# ===============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.add-mappings=false

# Configuração de timezone
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Configuração de upload de arquivos
file.upload-dir=./uploads